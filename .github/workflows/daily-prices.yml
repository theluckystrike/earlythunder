name: Daily Price Update
on:
  schedule:
    - cron: '30 8 * * *'  # 08:30 UTC, after refresh-opportunity-prices (07:30)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-prices
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests yfinance
      - run: python scripts/update-prices.py
      - run: python scripts/validate-data.py
      # Every price-derived figure on the scorecard pages (price, market cap,
      # all-time high, supply, dilution) comes from this snapshot. Refresh it
      # before rebuilding the analytics layer, or the pages hold yesterday's
      # numbers while looking current.
      - run: node scripts/fetch-scorecard-market.mjs
      - run: node scripts/build-scorecard-analytics.mjs
      # Per-variable leaderboards and the curated comparison list are derived
      # from the analytics layer, so they go stale the moment it moves.
      - run: node scripts/build-longtail-layer.mjs
      - run: git pull --rebase --autostash origin main
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'data: daily price update'
          file_pattern: 'data/opportunities.json data/scorecard-analytics.json data/scorecard-market.json data/scorecard-signals.json data/scorecard-pairs.json'
